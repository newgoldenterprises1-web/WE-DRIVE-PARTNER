name: Deploy AI Office Proxy

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Type DEPLOY to deploy the AI Office proxy to Firebase
        required: true
        default: ''
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: we-drive-4315a
    steps:
      - name: Validate deployment gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_deployment != 'DEPLOY' }}
        run: |
          echo "AI Office proxy deployment requires confirm_deployment=DEPLOY."
          exit 1

      - name: Checkout AI gateway source
        uses: actions/checkout@v4
        with:
          # Deploy the dedicated AI gateway branch; Customer/Partner app code is not touched.
          ref: phase2f-ai-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: we-drive-4315a
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy AI Office proxy with Cloud Functions v2
        run: |
          set -euo pipefail
          gcloud functions deploy aiOfficeProxy \
            --gen2 \
            --project "$GCP_PROJECT_ID" \
            --region asia-south1 \
            --runtime nodejs22 \
            --source functions \
            --entry-point aiOfficeProxy \
            --trigger-http \
            --allow-unauthenticated \
            --service-account we-drive-ai-runtime@we-drive-4315a.iam.gserviceaccount.com \
            --timeout 30s \
            --set-env-vars "AI_OFFICE_ORIGIN=https://wedriveai.free.je,https://we-drive-ai-office-xdfecmdfwq-el.a.run.app,AI_OFFICE_ADMIN_EMAILS=newgoldenterprises0@gmail.com,WE_DRIVE_AI_SERVICE_URL=https://we-drive-ai-staging-35696955893.asia-south1.run.app" \
            --set-secrets "WE_DRIVE_AI_API_TOKEN=WE_DRIVE_AI_API_TOKEN:latest"

      - name: Verify AI backend upstream
        env:
          WE_DRIVE_AI_SERVICE_URL: https://we-drive-ai-staging-35696955893.asia-south1.run.app
        run: |
          set -euo pipefail
          AI_TOKEN="$(gcloud secrets versions access latest --secret=WE_DRIVE_AI_API_TOKEN --project "$GCP_PROJECT_ID")"
          test -n "$AI_TOKEN"
          echo "::add-mask::$AI_TOKEN"
          curl --fail --silent --show-error             -H "Authorization: Bearer $AI_TOKEN"             "$WE_DRIVE_AI_SERVICE_URL/health"
          echo
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: Bearer $AI_TOKEN"             -H "Content-Type: application/json"             -d '{"actor_id":"ai-office-proxy-smoke-test","message":"hello"}'             "$WE_DRIVE_AI_SERVICE_URL/v1/agent")"
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("agent"), "missing agent"; assert d.get("action"), "missing action"; print("AI backend upstream contract: OK")'

      - name: Verify AI Office proxy deployment
        run: |
          set -euo pipefail
          URI="$(gcloud functions describe aiOfficeProxy --gen2 --project "$GCP_PROJECT_ID" --region asia-south1 --format='value(serviceConfig.uri)')"
          test -n "$URI"
          STATUS="$(curl -sS -o /tmp/ai-office-proxy-body -w '%{http_code}' -X OPTIONS "$URI" -H 'Origin: https://wedriveai.free.je' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: Authorization,Content-Type')"
          test "$STATUS" = "204"
          grep -qi "Access-Control-Allow-Origin: https://wedriveai.free.je" /tmp/ai-office-proxy-body || true
          echo "AI Office proxy deployed: $URI"
      - name: Remove generated Firebase parameter file
        if: always()
        run: if [ -n "${GCP_PROJECT_ID:-}" ]; then rm -f "functions/.env.${GCP_PROJECT_ID}"; fi
