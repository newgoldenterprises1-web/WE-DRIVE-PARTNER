name: Deploy AI Office Proxy
# redeploy latest authenticated proxy user-context + live operational summary + upstream diagnostics fix
# AI Office auth uses standard ID-token verification; no privileged revocation lookup is required.

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Type DEPLOY to deploy the AI Office proxy to Firebase
        required: true
        default: ''
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: we-drive-4315a
      AI_OFFICE_ORIGINS: https://wedriveai.free.je;https://we-drive-ai-office-xdfecmdfwq-el.a.run.app
      AI_RUNTIME_SERVICE_ACCOUNT: we-drive-ai-runtime@we-drive-4315a.iam.gserviceaccount.com
    steps:
      - name: Validate deployment gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_deployment != 'DEPLOY' }}
        run: |
          echo "AI Office proxy deployment requires confirm_deployment=DEPLOY."
          exit 1

      - name: Checkout AI gateway source
        uses: actions/checkout@v4
        with:
          ref: phase2f-ai-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: we-drive-4315a
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy AI Office proxy with Cloud Functions v2
        run: |
          set -euo pipefail
          gcloud functions deploy aiOfficeProxy             --gen2             --project "$GCP_PROJECT_ID"             --region asia-south1             --runtime nodejs22             --source functions             --entry-point aiOfficeProxy             --trigger-http             --allow-unauthenticated             --service-account "$AI_RUNTIME_SERVICE_ACCOUNT"             --timeout 30s             --set-env-vars "AI_OFFICE_ORIGIN=$AI_OFFICE_ORIGINS,AI_OFFICE_ADMIN_EMAILS=newgoldenterprises0@gmail.com,WE_DRIVE_AI_SERVICE_URL=https://we-drive-ai-staging-35696955893.asia-south1.run.app"             --set-secrets "WE_DRIVE_AI_API_TOKEN=WE_DRIVE_AI_API_TOKEN:latest"

      - name: Verify AI backend upstream
        env:
          WE_DRIVE_AI_SERVICE_URL: https://we-drive-ai-staging-35696955893.asia-south1.run.app
        run: |
          set -euo pipefail
          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$WE_DRIVE_AI_SERVICE_URL")"
          test -n "$ID_TOKEN"
          RESPONSE="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ID_TOKEN"             -H "Content-Type: application/json"             -d '{"actor_id":"ai-office-proxy-smoke-test","message":"hello"}'             "$WE_DRIVE_AI_SERVICE_URL/v1/agent")"
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("agent"), "missing agent"; assert d.get("action"), "missing action"; print("AI backend upstream contract: OK")'

      - name: Verify AI Office proxy CORS
        run: |
          set -euo pipefail
          URI="$(gcloud functions describe aiOfficeProxy --gen2 --project "$GCP_PROJECT_ID" --region asia-south1 --format='value(serviceConfig.uri)')"
          test -n "$URI"
          for ORIGIN in "https://wedriveai.free.je" "https://we-drive-ai-office-xdfecmdfwq-el.a.run.app"; do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$URI"               -H "Origin: $ORIGIN"               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: Authorization,Content-Type')"
            test "$STATUS" = "204"
            echo "CORS preflight OK: $ORIGIN"
          done
          echo "AI Office proxy deployed: $URI"

      - name: Inspect recent AI Office proxy errors
        if: always()
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="aiofficeproxy"'             --project "$GCP_PROJECT_ID"             --limit=20             --format='value(timestamp,severity,textPayload)' || true

      - name: Remove generated Firebase parameter file
        if: always()
        run: if [ -n "${GCP_PROJECT_ID:-}" ]; then rm -f "functions/.env.${GCP_PROJECT_ID}"; fi
