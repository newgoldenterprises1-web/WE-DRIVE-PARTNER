name: Deploy AI Office Proxy

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Type DEPLOY to deploy the AI Office proxy to Firebase
        required: true
        default: ''
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_deployment != 'DEPLOY' }}
        run: |
          echo "AI Office proxy deployment requires confirm_deployment=DEPLOY."
          exit 1

      - name: Checkout AI gateway source
        uses: actions/checkout@v4
        with:
          ref: phase2f-ai-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: we-drive-4315a
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Firebase CLI
        run: npm install --global firebase-tools@15.30.1

      - name: Validate deployment configuration
        env:
          AI_OFFICE_ORIGIN: https://wedriveai.free.je
          WE_DRIVE_AI_SERVICE_URL: https://we-drive-ai-staging-35696955893.asia-south1.run.app
        run: |
          set -euo pipefail
          GCP_PROJECT_ID="$(gcloud config get-value project 2>/dev/null)"
          test -n "$GCP_PROJECT_ID"
          test "$GCP_PROJECT_ID" != "(unset)"
          test -n "$WE_DRIVE_AI_SERVICE_URL"
          test -n "$AI_OFFICE_ORIGIN"
          echo "Using Google Cloud project: $GCP_PROJECT_ID"
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Prepare Firebase Functions runtime parameters
        env:
          AI_OFFICE_ORIGIN: https://wedriveai.free.je
          WE_DRIVE_AI_SERVICE_URL: https://we-drive-ai-staging-35696955893.asia-south1.run.app
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: |
          printf '%s\n' \
            "AI_OFFICE_ORIGIN=$AI_OFFICE_ORIGIN" \
            "WE_DRIVE_AI_SERVICE_URL=$WE_DRIVE_AI_SERVICE_URL" \
            > "functions/.env.$GCP_PROJECT_ID"

      - name: Deploy only AI Office proxy
        run: |
          firebase deploy --only functions:aiOfficeProxy --project "$GCP_PROJECT_ID" --force --non-interactive

      - name: Remove generated Firebase parameter file
        if: always()
        run: if [ -n "${GCP_PROJECT_ID:-}" ]; then rm -f "functions/.env.${GCP_PROJECT_ID}"; fi
