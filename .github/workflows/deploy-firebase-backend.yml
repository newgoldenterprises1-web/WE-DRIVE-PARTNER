name: Deploy Firebase Backend

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Type DEPLOY to deploy Firebase Functions to we-drive-4315a
        required: true
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment == 'DEPLOY' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: we-drive-4315a
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Functions
        working-directory: .
        run: firebase deploy --only functions --project we-drive-4315a --non-interactive

      - name: Verify deployed functions
        run: |
          node -e "require('./index.js'); console.log('Firebase Functions module loaded successfully.')"
